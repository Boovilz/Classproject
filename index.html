<style>
  body { --app-bg: #0a0a12; }
  @keyframes portalFlash {
    0% { opacity: 0; transform: scale(1.4); }
    35% { opacity: 1; transform: scale(1); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: scale(0.96); }
  }
  @keyframes portalText {
    0% { opacity: 0; transform: translateY(18px) scale(0.9); }
    40% { opacity: 1; transform: none; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
  .spin { animation: spinSlow .7s linear infinite; }
</style>
</head>
<body>
<div id="root"></div>

<button id="themeToggle" aria-label="slับธีม">
  <span class="ico" id="themeIco"></span>
  <span id="themeLabel">8-BIT</span>
</button>
<script>
  (function () {
    var GLASS = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="M7 9c2-2 8-2 10 0"/></svg>';
    var PIXEL = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM16 10h4v4h-4zM4 16h4v4H4zM10 16h4v4h-4zM16 16h4v4h-4z"/></svg>';
    var root = document.documentElement;
    function apply(t) {
      if (t === 'retro') root.setAttribute('data-theme', 'retro');
      else root.removeAttribute('data-theme');
      var ico = document.getElementById('themeIco');
      var lab = document.getElementById('themeLabel');
      if (t === 'retro') { ico.innerHTML = GLASS; lab.textContent = 'GLASS'; }
      else { ico.innerHTML = PIXEL; lab.textContent = '8-BIT'; }
    }
    var cur = localStorage.getItem('gcos.theme') || 'glass';
    apply(cur);
    document.getElementById('themeToggle').addEventListener('click', function () {
      cur = (cur === 'retro') ? 'glass' : 'retro';
      localStorage.setItem('gcos.theme', cur);
      apply(cur);
    });
  })();
</script>
